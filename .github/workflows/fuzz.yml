name: Adversarial fuzzing

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * 0"

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_requirements
          - fuzz_lockfiles
          - fuzz_provenance
          - fuzz_artifacts
          - fuzz_exports
          - fuzz_indexes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked fuzz environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements/ci.lock
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements/fuzz.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
          python -m pip check
      - name: Fuzz ${{ matrix.target }}
        run: >-
          python fuzz/${{ matrix.target }}.py
          -runs=1000
          -max_len=65536
          -timeout=10
