name: SARIF integration

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  upload-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Trustcheck
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements/ci.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
          python -m pip check

      - name: Generate equivalent vulnerable-fixture SARIF reports
        run: |
          trustcheck scan \
            --file tests/fixtures/requirements-vulnerable.txt \
            --no-deps \
            --fast \
            --with-osv \
            --fail-on-vulnerability ignore \
            --format sarif \
            --output-file trustcheck-first.sarif
          trustcheck scan \
            --file tests/fixtures/requirements-vulnerable.txt \
            --no-deps \
            --fast \
            --with-osv \
            --fail-on-vulnerability ignore \
            --format sarif \
            --output-file trustcheck-second.sarif

      - name: Validate GitHub SARIF and stable fingerprints
        run: >-
          python scripts/validate_sarif.py
          trustcheck-first.sarif
          --compare trustcheck-second.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trustcheck-first.sarif
          category: trustcheck-sarif-integration
