name: Semgrep

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Semgrep
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --requirement requirements/semgrep.lock
          python -m pip check

      - name: Run Semgrep
        run: semgrep scan --config p/python --config p/security-audit --error --metrics=off .
